<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1712">
<link rel="manifest" href="manifest.json">
<title>BeeGuard</title>
<style>
body{margin:0;font-family:system-ui;background:#0f1712;color:#fff}.app{max-width:520px;margin:auto;padding:18px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:30px;font-weight:800;color:#f2bd45}.muted{color:#9fb0a5}.panel,.card{background:#17241c;border:1px solid #2d4535;border-radius:20px;padding:16px;margin:12px 0}.score{text-align:center}.score b{display:block;font-size:60px;color:#f2bd45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{margin:0}.card strong{display:block;font-size:23px;margin-top:6px}.ok{color:#72df98}.danger{color:#ff7676}.btn{width:100%;border:0;border-radius:14px;padding:13px;background:#f2bd45;font-weight:800;margin-top:10px}.secondary{background:#23362a;color:#fff;border:1px solid #2d4535}input{width:100%;padding:13px;border-radius:12px;border:1px solid #2d4535;background:#101a14;color:#fff;box-sizing:border-box}.hide{display:none}.status{font-size:13px;color:#9fb0a5;margin-top:8px}.event{padding:10px 0;border-bottom:1px solid #2d4535}
</style>
</head>
<body>
<div class="app">
<div class="top"><div><div class="brand">BeeGuard</div><div class="muted">مراقبة وحماية خلية النحل</div></div><strong>BG-001</strong></div>

<div id="login" class="panel">
<h3>الدخول إلى BeeGuard</h3>
<p class="muted">أدخل بريدك وسيصل رابط دخول آمن. أو شغّل وضع المحاكاة مباشرة.</p>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<button class="btn" onclick="magic()">إرسال رابط الدخول</button>
<button class="btn secondary" onclick="demo()">عرض المحاكاة الآن</button>
<div id="msg" class="status"></div>
</div>

<div id="dash" class="hide">
<div class="panel score"><span class="muted">BeeGuard Score</span><b id="score">--</b><div id="state">جاري التحميل...</div></div>
<div class="grid">
<div class="card"><small class="muted">الوزن</small><strong id="w">--</strong></div>
<div class="card"><small class="muted">الحرارة</small><strong id="t">--</strong></div>
<div class="card"><small class="muted">الرطوبة</small><strong id="h">--</strong></div>
<div class="card"><small class="muted">البطارية</small><strong id="b">--</strong></div>
<div class="card"><small class="muted">النشاط الصوتي</small><strong id="s">--</strong></div>
<div class="card"><small class="muted">الشبكة</small><strong id="n">--</strong></div>
</div>
<div class="panel"><strong id="source">المصدر: —</strong><div id="last" class="status"></div><button class="btn secondary" onclick="load()">تحديث الآن</button></div>
<div class="panel"><h3>آخر التنبيهات</h3><div id="events">—</div></div>
</div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://jlmkohjnpxpidpxfbbov.supabase.co','sb_publishable_riIjdtRfhTkNafyp_425Vw_88Bmx9TW');
let demoMode=false;
window.magic=async()=>{const email=document.getElementById('email').value.trim();if(!email)return msg.textContent='أدخل البريد الإلكتروني.';const {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});msg.textContent=error?error.message:'تم إرسال رابط الدخول إلى بريدك.'}
window.demo=()=>{demoMode=true;start();};
function start(){login.classList.add('hide');dash.classList.remove('hide');load();setInterval(load,30000);}
window.load=async()=>{
 if(demoMode){const k=Date.now()/60000;render({recorded_at:new Date().toISOString(),weight_kg:(27.6+Math.sin(k/5)*.35).toFixed(2),temperature_c:(34.2+Math.sin(k/7)*.8).toFixed(1),humidity_pct:(60+Math.cos(k/6)*3).toFixed(0),battery_pct:86,sound_score:(72+Math.sin(k/3)*6).toFixed(0),network:'4G',beeguard_score:(92+Math.sin(k/8)*2).toFixed(0),source:'simulation'},'normal');events.innerHTML='<div class="event"><strong>حركة خفيفة - اختبار</strong><div class="status">حدث محاكاة</div></div>';return;}
 const {data:hive,error:e1}=await supabase.from('hives').select('id,hive_code,name,status').eq('hive_code','BG-001').single();if(e1)return fail(e1.message);
 const {data:d,error:e2}=await supabase.from('telemetry').select('recorded_at,weight_kg,temperature_c,humidity_pct,battery_pct,sound_score,network,beeguard_score,source').eq('hive_id',hive.id).order('recorded_at',{ascending:false}).limit(1).single();if(e2)return fail(e2.message);
 render(d,hive.status);
 const {data:ev}=await supabase.from('events').select('created_at,title,details').eq('hive_id',hive.id).order('created_at',{ascending:false}).limit(5);
 events.innerHTML=ev?.length?ev.map(x=>`<div class="event"><strong>${x.title}</strong><div class="status">${new Date(x.created_at).toLocaleString('ar-SA')}</div><div>${x.details||''}</div></div>`).join(''):'لا توجد تنبيهات.';
}
function render(d,status){score.textContent=Math.round(Number(d.beeguard_score||0));state.textContent=status==='normal'?'الحالة العامة: طبيعية':'الحالة: '+status;state.className=status==='normal'?'ok':'danger';w.textContent=(d.weight_kg||'--')+' كجم';t.textContent=(d.temperature_c||'--')+'°C';h.textContent=(d.humidity_pct||'--')+'%';b.textContent=(d.battery_pct||'--')+'%';s.textContent=(d.sound_score||'--')+'/100';n.textContent=d.network||'—';source.textContent='المصدر: '+(d.source==='device'?'الجهاز الحقيقي':'محاكاة تجريبية');last.textContent='آخر قراءة: '+new Date(d.recorded_at).toLocaleString('ar-SA');}
function fail(x){state.textContent='تعذر جلب البيانات';state.className='danger';last.textContent=x}
const {data:{session}}=await supabase.auth.getSession();if(session)start();supabase.auth.onAuthStateChange((_e,s)=>{if(s&&!demoMode)start();});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js');
</script>
</body></html>
